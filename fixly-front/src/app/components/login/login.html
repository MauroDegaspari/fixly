<div class="background"></div>

<div class="login-container">
  <div class="login-card">

    <mat-icon class="login-icon">
      security
    </mat-icon>

    <div class="logo">
      Fixly
    </div>

    <h1>Bem-vindo de volta</h1>

    <p>
      Acesse sua conta para gerenciar chamados,
      técnicos e clientes.
    </p>

    <form class="login-form" (ngSubmit)="logar()">

      <mat-form-field appearance="outline" class="full-width">

        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          [formControl]="email"
          placeholder="Digite seu email">

      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">

        <mat-label>Senha</mat-label>

        <input
          matInput
          type="password"
          [formControl]="senha"
          placeholder="Digite sua senha">

      </mat-form-field>

      <button
        type="submit"
        [disabled]="!validarCampos()"
        mat-raised-button
        class="btn-login">

        Entrar

      </button>

    </form>

    <span class="version">
      Fixly © 2026
    </span>

  </div>
</div>
