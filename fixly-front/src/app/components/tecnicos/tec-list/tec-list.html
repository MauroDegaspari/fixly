<div class="container-table">

    <div class="table-header">
        <div>
            <h1>Técnicos</h1>
            <p>Gerencie os técnicos cadastrados no sistema</p>
        </div>

        <div class="header-actions">
            <mat-form-field appearance="outline" class="search-input">
                <mat-label>Pesquisar técnico</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Valdir">
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>

            <button class="btn-add" (click)="abrirModal()" matTooltip="Adicionar Técnico" matTooltipPosition="above">
               + Novo Técnico
            </button>
        </div>
    </div>

    <div class="table-content mat-elevation-z8">

        <table mat-table [dataSource]="dataSource">

            <!-- ID -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>

            <!-- Nome -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Nome</th>
                <td mat-cell *matCellDef="let element"> {{element.nome}}  </td>
            </ng-container>

            <!-- email -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>Email</th>
                <td mat-cell *matCellDef="let element"> {{element.email}} </td>
            </ng-container>

            <!-- CPF (Antigo Perfil) -->
            <ng-container matColumnDef="cpf">
                <th mat-header-cell *matHeaderCellDef>CPF</th>
                <td mat-cell *matCellDef="let element"> {{element.cpf}} </td>
            </ng-container>

                    <!-- Ações -->
            <ng-container matColumnDef="acao">
                <th mat-header-cell *matHeaderCellDef> Ações </th>
                <td mat-cell *matCellDef="let element"> 
                    <button mat-icon-button class="btn-edit" (click)="editarTecnicoModal(element)" matTooltip="Editar Técnico" matTooltipPosition="above">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button class="btn-delete" (click)="deletarTecnico(element)" matTooltip="Deletar Técnico">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

            <tr class="table-row" mat-row *matRowDef="let row; columns: displayedColumns;">
            </tr>

        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
        </mat-paginator>

    </div>

</div>
